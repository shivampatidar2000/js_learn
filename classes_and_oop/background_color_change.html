<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Background Color Change</title>
</head>
<body>
    <h1>Background Color Change</h1>
    <button id="btn">Click Me</button>
</body>

<script>
    const btn = document.getElementById("btn")
    const body = document.querySelector("body")
    function random(number){
        return Math.round(Math.random() * number + 1)
    }

    function color_change(){
        body.style.backgroundColor = `rgb(${random(255)} ${random(255)} ${random(255)})`
    }
    btn.addEventListener("click", color_change)
</script>
</html>
