<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button>click me</button>
</body>
<script>
    const btn = document.querySelector("button");
    const body = document.querySelector('body')

    function random(number){
        return Math.round(Math.random()* number +1 )
    }
    // focus -> focus the button is click after click we need to unfocus the button then click 
    // blur -> blur the button is unfocuse and click the page the it is focus
    // dblclick — The color changes only when the button is double-clicked.
    // mouseover and mouseout — The color changes when the mouse pointer hovers over the button, or when the pointer moves off the button, respectively
    btn.addEventListener("mouseout", ()=>{
        const rancol = `rgb(${random(255)} ${random(255)} ${random(255)})`;
        console.log(rancol)
        body.style.backgroundColor = rancol;
    })
</script>
</html>
