<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
</body>
<script>

    // first promise 
    const promiseOne = new Promise(function(resolve,reject){
        setTimeout(function(){
            console.log("promiseOne is print")
            resolve()
        },1000)
    })
    promiseOne.then(function(){
        console.log("Promise one then is print ") 
    })

    // Second promise 

    new Promise((resolve, reject)=>{
        setTimeout(()=>{console.log("second promise"), resolve()},1000)
    }).then(()=>{console.log("then for second primise")})

    // third promise

    const thirdPromise = new Promise((resolve, reject)=>{
        setTimeout(()=>{
            resolve({userName: "shivam", password: "1234"})
        },1000)
    })
    thirdPromise.then(function(user){
        console.log(user);
        return user
    }).then((userName, passsword)=>{
        console.log(`userName: ${userName.userName} and passsword ${userName.password}` )
    })

    // fouth promise

    const fouthPromise = new Promise(function(resolve, reject){
        setTimeout(()=>{
            let error = true
            if(!error){ 
                resolve({userName: "Test", password: "1234"})
            }else{
                reject("ERROR: fouth Promise error")
            }
        },1000)
    })
    fouthPromise.then(function(user){
        console.log(user)
    }).catch(function(error){
        console.log(error)
    }).finally(function(){
        console.log("fourth promise either reject or either resolve")
    })

    //fifth promise
    const fifthPromise = new Promise((resolve, reject)=>{
        setTimeout(()=>{
            let error = false
            if(!error){ 
                resolve({userName: "Eahul", password: "1234"})
            }else{
                reject("ERROR: Fith Promise error")
            }        
        },1000)
    })

    async function asyncFivePromise(){

        try{
            const response = await fifthPromise
            console.log(response.userName)
        }catch(error){
            console.log(error)
        }
    }
    asyncFivePromise()

    async function asyncSixPromise(){
        try{
            const response = await fetch('https://jsonplaceholder.typicode.com/users')
            const data = await response.json();
            console.log("funcation",data);
        }catch(error){
            console.log(error)
        }
    }
    asyncSixPromise()

    fetch('https://jsonplaceholder.typicode.com/users').then((response)=>{
        return response.json();
    }).then((data)=>{
        console.log("promise then",data)
    }).catch((error)=>{console.log(error)})
</script>
</html>
