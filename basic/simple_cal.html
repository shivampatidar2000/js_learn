<script>
    let num1 = Number(prompt("Enter the value1:"));
    let num2 = Number(prompt("Enter the value2:"));
    let opr = prompt("Enter the opr(+,-,*,/):");
    switch(opr){
        case '+':
            console.log(`Addition of the num1 and num2 is ${num1 + num2}`);
            break;
        case '-':
            console.log(`Subtraction of the num1 and num2 is ${num1 - num2}`);
            break;    
        case '*':
            console.log(`Multipication of the num1 and num2 is ${num1 * num2}`);
            break;
        case '/':
            console.log(`Devision of the num1 and num2 is ${num1 / num2}`);
            break;
        default: 
            console.log("Not right opration");
            break;

    }
</script>
