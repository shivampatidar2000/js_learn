<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI calculate</title>
    <link rel="stylesheet" href="second_project.css">
</head>
<body>
    <div class="container">
        <h1>BMI Calculater</h1>
        <form action="">
            <p><label for="height">Height In CM:</label><input type="text" id="height"></p>
            <p><label for="weight">Weight In KG:</label><input type="text" id="weight"></p>
            <button class="calculate">Calculate</button><br>
            <div class="result"></div>
            <div class="result-guide"></div>

            <div id="weight-guide">
                <h3>BMI Weight guide</h3>
                <p>Under Weight = less then 18.6</p>
                <p>Normal range = 18.6 to 24.9</p>
                <p>Overweight = Greater then 24.9 </p>

            </div>
        </form>
    </div>
    <script src="second_project.js"></script>
</body>
</html>
